[package]
name = "scriptrs-python"
# keep equal to the scriptrs version; the release workflow checks the wheel names
# against the tag
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/avencera/scriptrs"
authors = ["Praveen Perera"]
description = "Python bindings for scriptrs"
publish = false

# standalone, like the kernel crate, so the root stays a single-package manifest and
# copies of the repository nested inside it still build
[workspace]

[lib]
name = "scriptrs_native"
crate-type = ["cdylib"]
# the extension is tested through pytest; a Rust test harness would have to link libpython
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
rubato = "5.0.1"
scriptrs = { path = "../..", features = ["online", "vad"] }
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }

# one wheel per platform carries the backend that platform runs: Core ML on macOS
# and native CUDA on Linux x86_64, so a plain `maturin build` produces the release
# wheel. CUDA is loaded at run time, so the Linux wheel builds without a GPU or
# CUDA toolkit
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
scriptrs = { path = "../..", features = ["online", "vad", "cuda"] }
