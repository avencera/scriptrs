name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# a new push to a pull request supersedes its running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # the same gates as `just check`, through its recipes so the two stay in step
  lint:
    name: Format and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      # a prebuilt cargo-deny instead of cargo-deny-action, whose Docker build fails
      # whenever Docker Hub rate-limits the runner
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-deny@0.20.2

      # `just fmt` and `just python-lint` run ruff through uvx
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # `just fmt` rewrites files, so any diff it leaves means the code wasn't formatted
      - name: Format
        run: |
          just fmt
          git diff --exit-code

      - name: Python lints
        run: just python-lint

      - name: No ONNX Runtime
        run: just no-ort

      - name: Advisories, licenses and sources
        run: just deny

  check:
    name: Clippy and tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # builds the CUDA backend; a GitHub runner has no GPU, and the tests that
          # need one are ignored by default
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          # the CUDA backend and the Python bindings' CUDA path, as on Linux; there is
          # no GPU here either
          - name: Windows x86_64
            os: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: just clippy

      # docs.rs builds on Linux with every feature, so the CUDA docs only build here
      - name: Docs as docs.rs builds them
        if: runner.os == 'Linux'
        run: just doc

      - name: Test
        run: just test --all-features
