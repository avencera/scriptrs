[package]
name = "scriptrs"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
exclude = ["fixtures/", "dev-tools/", "crates/"]
authors = ["Praveen Perera"]
description = "Fast NVIDIA Parakeet TDT v2 and v3 speech-to-text in Rust, on Core ML (macOS) and native CUDA (Linux)"
license = "Apache-2.0"
repository = "https://github.com/avencera/scriptrs"
homepage = "https://github.com/avencera/scriptrs"
documentation = "https://docs.rs/scriptrs"
readme = "README.md"
keywords = ["parakeet", "speech-to-text", "asr", "cuda", "coreml"]
categories = ["multimedia::audio"]

[features]
default = ["online"]
# blocking Hub downloads through hf-fetch, with rustls and no async runtime
online = ["dep:hf-fetch", "hf-fetch/online"]
long-form = []
vad = ["long-form"]
# CUDA backend on native weights (ModelBundle::from_native_dir)
cuda = ["dep:memmap2", "dep:safetensors", "dep:cudakit", "cudakit/libraries"]
# FP8, INT8 and NVFP4 encoder precisions on CUDA, and the weight files that store
# them; not recommended for most users: slower than FP16 one utterance at a time
low-precision = ["cuda", "dep:cudarc"]

[dependencies]
cudakit = { version = "0.1", optional = true }
# only to turn on cuBLASLt in cudakit's cudarc, for the FP8 and NVFP4 encoder
# products; cudakit picks the CUDA version and loading
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["cublaslt"] }
memmap2 = { version = "0.9", optional = true }
ndarray = "0.17.2"
realfft = "3.5.1"
safetensors = { version = "0.8", optional = true }
serde_json = "1"
thiserror = "2.0.21"
tracing = "0.1.44"
hf-fetch = { version = "0.1.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-ml = { version = "0.3", features = [
    "MLAllComputeDevices",
    "MLCPUComputeDevice",
    "MLComputeDeviceProtocol",
    "MLComputePlan",
    "MLComputePlanDeviceUsage",
    "MLModel",
    "MLMultiArray",
    "MLModelConfiguration",
    "MLDictionaryFeatureProvider",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLGPUComputeDevice",
    "MLModelStructure",
    "MLModelStructureNeuralNetwork",
    "MLModelStructurePipeline",
    "MLModelStructureProgram",
    "MLModelStructureProgramBlock",
    "MLModelStructureProgramFunction",
    "MLModelStructureProgramOperation",
    "MLModel_MLComputeDevice",
    "MLNeuralEngineComputeDevice",
    "alloc",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "NSSet",
    "NSEnumerator",
    "NSObjCRuntime",
] }

[dev-dependencies]
approx = "0.5.1"
eyre = "0.6.14"
hound = "3.5.1"
memmap2 = "0.9"
safetensors = "0.8"
tempfile = "3.27.0"

[[example]]
name = "cuda_bench"
required-features = ["cuda", "long-form"]

[[example]]
name = "quantize_native"
required-features = ["low-precision"]

[[example]]
name = "stream_bench"
required-features = ["cuda"]

[[example]]
name = "scheduler_bench"
required-features = ["cuda", "long-form"]

[[test]]
name = "scheduled"
required-features = ["cuda", "long-form"]
