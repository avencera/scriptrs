[package]
name = "scriptrs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
exclude = ["fixtures/", "dev-tools/", "crates/"]
authors = ["Praveen Perera"]
description = "Fast NVIDIA Parakeet TDT v2 and v3 speech-to-text in Rust, on Core ML (macOS) and native CUDA (Linux)"
license = "Apache-2.0"
repository = "https://github.com/avencera/scriptrs"
homepage = "https://github.com/avencera/scriptrs"
documentation = "https://docs.rs/scriptrs"
readme = "README.md"
keywords = ["parakeet", "speech-to-text", "asr", "cuda", "coreml"]
categories = ["multimedia::audio"]

[features]
default = ["online"]
online = ["dep:hf-hub", "hf-hub/ureq", "hf-hub/native-tls"]
long-form = []
vad = ["long-form"]
# experimental CUDA backend on native weights (ModelBundle::from_native_dir)
cuda = ["dep:memmap2", "dep:safetensors", "dep:cudakit", "cudakit/libraries"]

[dependencies]
# pinned by git until cudakit is on crates.io
cudakit = { git = "https://github.com/avencera/cudakit", rev = "414713603a2cf721283e71ded88cd10014efdf45", optional = true }
hf-hub = { version = "0.5", optional = true, default-features = false }
memmap2 = { version = "0.9", optional = true }
ndarray = "0.17.2"
realfft = "3.5.0"
safetensors = { version = "0.8", optional = true }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-ml = { version = "0.3", features = [
    "MLAllComputeDevices",
    "MLCPUComputeDevice",
    "MLComputeDeviceProtocol",
    "MLComputePlan",
    "MLComputePlanDeviceUsage",
    "MLModel",
    "MLMultiArray",
    "MLModelConfiguration",
    "MLDictionaryFeatureProvider",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLGPUComputeDevice",
    "MLModelStructure",
    "MLModelStructureNeuralNetwork",
    "MLModelStructurePipeline",
    "MLModelStructureProgram",
    "MLModelStructureProgramBlock",
    "MLModelStructureProgramFunction",
    "MLModelStructureProgramOperation",
    "MLModel_MLComputeDevice",
    "MLNeuralEngineComputeDevice",
    "alloc",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "NSSet",
    "NSEnumerator",
    "NSObjCRuntime",
] }

[dev-dependencies]
approx = "0.5.1"
eyre = "0.6.12"
hound = "3.5.1"
memmap2 = "0.9"
safetensors = "0.8"
tempfile = "3.23.0"

[[example]]
name = "cuda_bench"
required-features = ["cuda", "long-form"]
